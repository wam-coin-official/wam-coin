# ===========================================================================
#  When the node comes back, bring ElectrumX with it
# ===========================================================================
#
#  wam-electrumx.service declares Requires=wamd.service, and the reason is
#  sound: without the node it has nothing to index and nothing true to say,
#  so it is better absent than answering from a stale database.
#
#  But Requires points one way. Stopping wamd stops ElectrumX deliberately --
#  and a deliberate stop is not a failure, so Restart=always does not apply --
#  and starting wamd again does nothing for it. It simply stays down.
#
#  That happened twice.
#
#  On 2026-08-20 the node was restarted during the testnet reset and ElectrumX
#  sat dead for 39 hours. On 2026-08-23 the node was restarted to deploy
#  v0.1.5 and it went down again, on BOTH hosts, and was found only because a
#  reachability check happened to probe 50002 while testing something else.
#  Each time the fix was "start it again", which is not a fix.
#
#  Wants= is the other direction: starting wamd pulls ElectrumX up with it.
#  Not Requires -- the node must still start when ElectrumX cannot, because a
#  chain that refuses to run without its block explorer's indexer has the
#  dependency backwards.
# ===========================================================================

[Unit]
Wants=wam-electrumx.service
