# ===========================================================================
#  Build and publish a WAM Coin release.
#
#  Pushing a tag is the whole trigger. GitHub builds the binaries on its own
#  machines and publishes them itself, using a token it issues to this job and
#  destroys when the job ends. No release token exists on anyone's laptop, and
#  nobody has to remember to drag files into a browser -- which is exactly how
#  the first release came to be announced without existing.
#
#      git tag -a v0.1.0 -m 'first testnet release'
#      git push origin v0.1.0
#
#  The build recipe is not written here. It is install.sh, the same script a
#  user runs, so the published binaries cannot drift from the documented build.
#  A second recipe in this file would be correct on the day it was written and
#  wrong the first time install.sh changed.
# ===========================================================================

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.1.0). Builds but does not publish.'
        required: true

permissions:
  contents: write        # required to create the release; nothing else is granted

jobs:
  build:
    # 22.04 on purpose, not ubuntu-latest. A binary linked against a newer
    # glibc will not start on an older one, so building on the oldest release
    # we support is what makes the tarball run on both 22.04 and 24.04.
    # `latest` silently becomes a newer distro one day and quietly drops
    # everyone still on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # package_release.sh reports the commit it built

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: The tag must match the version the binary will report
        run: |
          set -euo pipefail
          # v0.1.1 was tagged, built, published and verified -- and the binary
          # inside announced itself as /WAM:0.1.0/ to every peer, because the
          # version lives in the source and nothing compared the two. A release
          # whose name disagrees with the software in it is the same class of
          # fault as a node on the wrong chain: everything looks right until
          # someone tries to tell two builds apart.
          tag="${{ steps.v.outputs.version }}"
          src="$(python3 -c "
          import re, pathlib
          t = pathlib.Path('scripts/patch_upstream.py').read_text(encoding='utf-8')
          m = re.search(r'^WAM_CLIENT_VERSION\s*=\s*\"([^\"]+)\"', t, re.M)
          print(m.group(1) if m else '')
          ")"
          echo "tag=$tag  source=$src"
          [ -n "$src" ] || { echo "::error::WAM_CLIENT_VERSION not found in scripts/patch_upstream.py"; exit 1; }
          if [ "${tag#v}" != "$src" ]; then
            echo "::error::tag $tag does not match WAM_CLIENT_VERSION $src -- raise the version in the commit you tag"
            exit 1
          fi

      - name: Build node, RandomX and miner
        run: |
          # The same script a user runs. --build-only stops before starting
          # services; --node-only leaves out the pool, which is not shipped in
          # the release tarball.
          bash install.sh --build-only --node-only --network testnet --jobs "$(nproc)"

      - name: Package
        run: bash scripts/package_release.sh --version "${{ steps.v.outputs.version }}"

      - name: Verify the artifact before anyone can download it
        run: |
          set -euo pipefail
          cd out/release
          ls -la

          # A checksum file that does not match its own tarballs is worse than
          # none: it tells people a corrupt download is fine.
          sha256sum -c SHA256SUMS

          # Unpack somewhere with nothing built in it and confirm the binary
          # actually runs. A tarball that builds but does not start is the
          # failure this whole job exists to prevent.
          work="$(mktemp -d)"
          tar -xzf wam-coin-*.tar.gz -C "$work"
          node_bin="$(find "$work" -name wamd -type f | head -1)"
          [ -n "$node_bin" ] || { echo "::error::no wamd in the tarball"; exit 1; }
          chmod +x "$node_bin"
          "$node_bin" -version | head -3

          # Compare the shared libraries against a recorded list, not a count
          # with room in it. A ceiling of "no more than eight" passes a build
          # that swapped one library for another, and passes three new ones the
          # day a legitimate one is dropped -- which is how a check ends up
          # green while the thing it guards is broken.
          #
          # Any difference in either direction is a failure. Something added is
          # a dependency that crept back in; something missing means a feature
          # was silently compiled out, and the wallet disappearing is not a
          # smaller problem than Kerberos reappearing.
          cat > /tmp/expected-libs <<'LIBS'
          libc.so.6
          libevent-2.1.so.7
          libevent_core-2.1.so.7
          libevent_pthreads-2.1.so.7
          libgcc_s.so.1
          libm.so.6
          libsqlite3.so.0
          libstdc++.so.6
          LIBS
          sed -i 's/^ *//' /tmp/expected-libs

          ldd "$node_bin" | awk '/=>/ {print $1}' | sort -u > /tmp/actual-libs
          echo "linked against:"; sed 's/^/  /' /tmp/actual-libs

          if ! diff -u /tmp/expected-libs /tmp/actual-libs > /tmp/libdiff; then
            echo "::error::the shared library set changed (- expected, + actual)"
            cat /tmp/libdiff
            exit 1
          fi

          # And confirm it starts on 22.04 rather than only linking correctly.
          # package_release.sh already gates the symbol versions, but that runs
          # on the build machine; this is the binary as a downloader gets it.
          "$node_bin" -version >/dev/null 2>/tmp/starterr || {
            echo "::error::the packaged wamd does not start here"
            cat /tmp/starterr; exit 1
          }

      - name: Publish the release
        if: steps.v.outputs.publish == 'yes'
        env:
          # Issued by GitHub for this run and revoked when it ends. It is not a
          # personal token and cannot be reused anywhere else.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          # Everything below 1.0 is a pre-release, and says so on the page,
          # rather than depending on whoever cut it to remember the checkbox.
          prerelease=""
          case "$VERSION" in v0.*) prerelease="--prerelease" ;; esac

          # A consensus-changing release must not be announced in the same
          # voice as any other. v0.1.5 moved the mainnet treasury address, and
          # a node left behind will reject every valid block and fork itself
          # off at height 1 -- silently. It keeps running and mining, alone.
          #
          # The announcement bot cannot know that unless it is told, so the
          # tag says it. Write a line in the annotated tag message:
          #
          #     MANDATORY: <one line saying why>
          #
          # and it is copied to the top of the release notes, where the bot
          # finds it and announces the release as UPDATE REQUIRED instead of
          # as news. Leaving it to somebody to remember to post a warning by
          # hand means the day they forget is the day it matters.
          mandatory="$(git tag -l --format='%(contents)' "$VERSION" \
                       | grep -iE '^[[:space:]]*MANDATORY:' | head -1 || true)"

          # A release that changes a consensus rule has to say so, and the
          # only thing that ever checked was somebody's memory.
          #
          # v0.1.5 moved the mainnet treasury address -- the one consensus
          # change this project has made since genesis -- and was published
          # with no MANDATORY line at all. Every mechanism built for that
          # case sat idle: the release notes did not carry the warning, the
          # bot announced it as ordinary news, and two independent operators
          # stayed on v0.1.4 for two days.
          #
          # consensus_floor.py derives, from the tags themselves, which
          # release last changed a consensus value. If that release is this
          # one, the tag must declare it.
          floor="$(python3 scripts/consensus_floor.py 2>/dev/null || true)"
          if [ "$floor" = "$VERSION" ] && [ -z "$mandatory" ]; then
            echo "::error::$VERSION changes a consensus value and its tag has no MANDATORY: line."
            echo "Nodes on any earlier release will reject every valid block and fork off,"
            echo "and nothing will tell them. Re-tag with a line reading:"
            echo
            echo "    MANDATORY: <one line saying what changed and what happens if you do not update>"
            echo
            python3 scripts/consensus_floor.py --explain || true
            exit 1
          fi

          # The rest of the tag message is the release note.
          #
          # It was thrown away until v0.1.6, which was tagged with a full
          # account of the bug it fixed -- which miners were affected, what
          # the symptom looked like, what to do -- and published with nothing
          # but the boilerplate below. The announcement bot quotes the release
          # body, so the channels carried a version number and a checksum
          # command and no reason for anyone to act.
          #
          # An annotated tag is where that explanation belongs: it is written
          # at the moment the release is cut, by whoever cut it, and it is
          # signed into the repository rather than typed into a web form
          # afterwards. Line 1 is the title, which gh already shows, and the
          # MANDATORY line is hoisted above -- both are dropped here so
          # nothing is printed twice.
          body="$(git tag -l --format='%(contents)' "$VERSION" \
                  | tail -n +2 \
                  | grep -ivE '^[[:space:]]*MANDATORY:' \
                  | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')"

          notes="$(mktemp)"
          {
            if [ -n "$mandatory" ]; then
              echo "$mandatory"
              echo
            fi
            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$body"
              echo
              echo "---"
              echo
            fi
            echo "Built by GitHub Actions from \`${GITHUB_SHA}\` on ubuntu-22.04."
            echo
            echo "Verify before running:"
            echo
            echo '```'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo '```'
            echo
            echo "WAM has no market value and may never have one. This is testnet"
            echo "software. Two independent developers have reviewed it and their"
            echo "findings were adopted; no security firm has audited it."
            echo
            echo "Build it yourself instead, if you prefer -- the release above is"
            echo "produced by \`install.sh --build-only\`, the same script in this"
            echo "repository, with no manual steps."
          } > "$notes"

          # gh is preinstalled on GitHub runners. Using it rather than a
          # third-party publishing action keeps the number of people who can
          # change what gets attached to a release at zero.
          gh release create "$VERSION" \
            --title "WAM Coin $VERSION" \
            --notes-file "$notes" \
            $prerelease \
            out/release/*.tar.gz \
            out/release/SHA256SUMS

      - name: Keep the artifact even when this was only a test build
        if: steps.v.outputs.publish != 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: wam-coin-${{ steps.v.outputs.version }}
          path: out/release/
          retention-days: 14
