# ===========================================================================
#  platform-build -- can this node be built for Windows and macOS, and does
#                    it still agree with the chain when it is?
# ===========================================================================
#
#  Run it by hand from the Actions tab, or push to a branch under platform/.
#
#  WHY THIS IS A SEPARATE WORKFLOW AND NOT PART OF release.yml
#
#  Every release so far is x86_64-linux-gnu. docs/ROADMAP.md §7 records why
#  that was a mistake and not an ordering: in a proof-of-work chain the miners
#  ARE the security, RandomX was chosen so an ordinary desktop competes, and
#  most ordinary desktops run Windows. There is no chain before the miners
#  arrive, so "platforms come after users" was never coherent.
#
#  What was missing was not the will. It was a fact: nobody here had ever run
#  the cross-build, so "six days is enough" and "six days is not enough" were
#  both opinions. This workflow replaces both with a result, at the cost of
#  free CI minutes and touching nothing:
#
#    * release.yml is not modified, and the signed Linux release is not rebuilt
#    * no server is involved
#    * nothing here can publish anything
#
#  AND WHY macOS TURNED OUT TO BE POSSIBLE
#
#  macOS was put behind Windows for two reasons. The first is real: upstream's
#  cross-build needs the macOS SDK extracted from Xcode with an Apple account,
#  under a licence nobody may redistribute. The second was wrong -- that
#  nobody here has a Mac to test on. GitHub's hosted runners are real macOS
#  machines, free for public repositories, and this repository is public. So
#  the build is native, no SDK is extracted, and the same runner RUNS what it
#  built. The half that was called impossible is the cheaper half.
#
#  THE GATE
#
#  Compiling proves the toolchain. It does not prove the binary computes the
#  same proof-of-work, applies the same monetary schedule, or enforces the 5%
#  treasury rule -- and a node that gets one of those wrong does not fail
#  loudly, it forks itself off and its owner mines onto a history nobody else
#  has. So every job here ends by syncing the real test network from genesis
#  and comparing block hashes with what the Linux nodes have held since
#  August. Green means agreed. Not green means not published.
# ===========================================================================

name: platform-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the archives, e.g. v0.1.8. Leave empty to use the newest tag.'
        required: false
        default: ''
  push:
    branches:
      - 'platform/**'

permissions:
  contents: read

# One run per branch. A new push cancels the one before it.
#
# Without this, three pushes in an hour queued three runs and they serialised
# behind the macOS runners -- which a free public repository gets few of, and
# each run asks for two. The oldest run, carrying none of the fixes, was still
# holding a place in the queue ahead of the newest. Measuring is only cheap if
# the measurement arrives.
concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  windows-cross:
    name: Windows x86_64 (cross-compiled on Linux)
    # 24.04, and release.yml stays on 22.04. Both are deliberate and the
    # reasons are opposite.
    #
    # The Linux release is built on the oldest distribution we support so its
    # glibc runs on 22.04 and 24.04 alike; building it on 24.04 would silently
    # drop everyone still on 22.04.
    #
    # A cross-compiled Windows binary links against Windows DLLs and carries
    # no glibc at all, so the host distribution leaves no trace in it -- and
    # 22.04 ships mingw with GCC 10.3, which cannot compile the C++20 that
    # Bitcoin Core v28 requires. The first run of this workflow proved it, on
    # 22.04, after cross-building boost, bdb, libevent and sqlite first:
    #
    #   configure: error: *** A compiler with support for C++20 language
    #                     features is required.
    #
    # 24.04 ships GCC 13. build_windows.sh now checks C++20 in its first
    # second instead of learning it from configure forty minutes in.
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, so the version can be read from the repository instead of
          # being typed into a form that nobody checks.
          fetch-tags: true
          fetch-depth: 0

      - name: The version these archives will claim
        id: ver
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            v="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            echo "::notice::No version was given, so the newest tag is used: $v"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "### Packaging as \`$v\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build tools, and the one mingw flag that is not optional
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Core's own dependencies, plus mingw. The -posix variant is not a
          # preference: the win32-threads runtime has no std::thread at all,
          # and Core uses it everywhere, so the wrong alternative produces
          # hundreds of lines of "'thread' is not a member of 'std'" -- which
          # reads like a broken source tree and is a toolchain setting.
          sudo apt-get install -qq -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils cmake curl git python3 \
            g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          x86_64-w64-mingw32-g++ -v 2>&1 | grep 'Thread model'

      - name: Fetch and patch Bitcoin Core
        run: bash scripts/fetch-upstream.sh

      - name: Cross-compile for Windows
        run: |
          set -o pipefail
          bash scripts/build_windows.sh 2>&1 | tee build-step.log

      # The reason a build failed has to be readable by whoever is looking,
      # without credentials. Job logs and artifacts both answer 403 anonymously,
      # so the first run of this workflow said "Process completed with exit code
      # 1" and hid the actual error behind a login. Annotations are served
      # without a token. See the header of the script.
      - name: Say why it failed, where it can be read without a token
        if: failure()
        run: bash scripts/ci_annotate_failure.sh build-step.log "cross-compiling for Windows"

      # clang, here rather than in the macOS job.
      #
      # The macOS build failed today on a clang/GCC disagreement in our own
      # source -- two RPCResult overloads both fitting four arguments, so ""
      # was a candidate for a bool. GCC chooses silently; clang refuses. Every
      # binary this project has produced came from GCC, which is why it
      # shipped.
      #
      # I put this check before the macOS build first, and it failed with
      # exit 2 -- correctly. It needs a CONFIGURED tree, and a fresh runner
      # has none: configure runs inside the build it was meant to precede.
      # Here the tree has just been configured by the cross-build, clang is on
      # the image, and the question -- does clang accept OUR sources -- has
      # nothing to do with the target. Twenty seconds, on every push, with no
      # macOS runner involved.
      - name: Ask clang about our sources
        run: bash scripts/test/test_clang.sh

      - name: The AVX-512 guard, on a PE file this time
        run: |
          # This is the reason check_isa_baseline.sh was changed today: its
          # format filter only recognised ELF, so a Windows binary walked
          # straight past the guard that exists because a published node died
          # with SIGILL on an AMD EPYC. A Windows audience is desktops of
          # every age, so it matters more here than it did on a server.
          bash scripts/check_isa_baseline.sh out/windows/*.exe

      # Packaged here, not on a laptop afterwards.
      #
      # Run #10 uploaded out/windows/ as it stood: five unstripped executables,
      # 197 MB. On a connection carrying 16 KB/s -- measured on the machine
      # that has to download it -- that is three and a half hours, so the
      # release could not be assembled at all. build_windows.sh now strips
      # before this point and the archive is a tenth of the size.
      #
      # Packaging before the consensus gate is the other half of the reason:
      # the gate below unpacks THIS archive and syncs the chain with the exact
      # files a stranger will download. Gate the build output and package
      # afterwards, and the bytes that were tested are not the bytes that ship.
      - name: Package it, exactly as it will be published
        run: |
          set -euo pipefail
          bash scripts/package_platform.sh \
              --platform windows \
              --version "${{ steps.ver.outputs.v }}" \
              --from out/windows
          ls -l out/release/

      - uses: actions/upload-artifact@v7
        with:
          # Same name as before on purpose -- but the contents changed from
          # loose .exe files to the finished archives plus their SHA256 lines.
          name: wam-windows-x86_64
          path: out/release/
          retention-days: 14

      - name: Keep the logs whatever happened
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-logs
          path: |
            build/configure-windows.log
            build/make-windows.log
            build/make-miner-windows.log
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  windows-consensus:
    name: Windows binary agrees with the chain
    needs: windows-cross
    runs-on: windows-latest
    # 180, and SYNC_TIMEOUT to match below.
    #
    # The first run of this failed after 30 minutes and 40 seconds -- which is
    # the gate's own default of 1800 seconds, not a disagreement with the
    # chain. A hosted runner has four slow vCPUs and RandomX verification is
    # the whole cost of a sync: the same binary reached height 6029 in about
    # ten minutes on a real desktop. Reported as it stood, "Windows binary
    # agrees with the chain: failed" is a verdict on consensus delivered about
    # a clock.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: wam-windows-x86_64
          path: dist

      # Expand-Archive rather than unzip: Git Bash is on this runner but its
      # unzip is not guaranteed to be, and a release gate is a bad place to
      # find that out.
      - name: Unpack the archives a stranger would download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unpacked, bin | Out-Null
          Get-ChildItem dist\*.zip | ForEach-Object {
              Write-Host "expanding $($_.Name)"
              Expand-Archive -LiteralPath $_.FullName -DestinationPath unpacked -Force
          }
          Get-ChildItem -Recurse -Filter *.exe unpacked |
              ForEach-Object { Copy-Item $_.FullName bin\ }
          Get-ChildItem bin | Format-Table Name, Length

      # The miner, before the node.
      #
      # It is cross-compiled on Linux and cannot run its own self-test there,
      # so miner/build.sh skips it and says so -- and this is the step that
      # makes that acceptable. The two RandomX vectors are the whole question:
      # a miner whose RandomX disagrees with the network hashes all day, finds
      # nothing, and reports no error at all.
      - name: The miner verifies its own RandomX, on Windows
        run: |
          set -euo pipefail
          ls -l bin/wam-miner.exe
          ./bin/wam-miner.exe --self-test --no-colour

      # What Microsoft's own scanner thinks of what we are about to publish.
      #
      # On 12 September the first Windows miner was run on a real desktop. It
      # passed every self-test, connected, authorized, took a job and hashed --
      # and fourteen seconds later Defender terminated the process and deleted
      # the file:
      #
      #     Trojan:Win32/Bearfoos.A!ml      SeverityID 5 (Severe)
      #
      # It is a false positive from a machine-learning classifier, and that
      # changes nothing about what it costs: a stranger who downloads a WAM
      # release on launch day, runs it, and is told by Windows that it is a
      # trojan does not come back. We cannot stop Microsoft from saying it. We
      # can refuse to learn it from him.
      #
      # This step never fails the build. A false positive must not be able to
      # block a release, but it must never again be a surprise -- so the
      # verdict is written into the run summary either way. The exit code is
      # swallowed deliberately and the reason is this sentence.
      - name: What Defender says about these binaries
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $files = Get-ChildItem bin\*.exe -ErrorAction SilentlyContinue
          if (-not $files) { "::warning::no binaries to scan"; exit 0 }

          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue).Count
          foreach ($f in $files) {
              Write-Host "scanning $($f.Name) ($([math]::Round($f.Length/1MB,1)) MB)"
              Start-MpScan -ScanType CustomScan -ScanPath $f.FullName -ErrorAction SilentlyContinue
          }
          $found = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)

          "## Windows Defender" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $sig = (Get-MpComputerStatus -ErrorAction SilentlyContinue).AntivirusSignatureVersion
          "Signature version: ``$sig``" | Out-File -Append $env:GITHUB_STEP_SUMMARY

          if ($found.Count -gt $before) {
              $new = $found | Sort-Object InitialDetectionTime -Descending |
                     Select-Object -First ($found.Count - $before)
              foreach ($d in $new) {
                  $line = "FLAGGED: ThreatID $($d.ThreatID) on $($d.Resources -join '; ')"
                  Write-Host "::warning::$line"
                  "- $line" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              }
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              ("A flag here is expected for the miner and is a false positive. " +
               "It must be submitted to Microsoft before the release is announced, " +
               "and docs/MINE.md must still describe the warning a user will see.") |
                  Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
              Write-Host "no new detections"
              "- No new detections on $($files.Count) binaries." |
                  Out-File -Append $env:GITHUB_STEP_SUMMARY
              ("This is an on-demand file scan. The detection seen on 12 September " +
               "was behavioural, raised while the miner was hashing, which no scan " +
               "of a file at rest can reproduce.") |
                  Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
          # Files Defender removed would break the gate below with a confusing
          # error, so say it plainly here instead.
          foreach ($f in $files) {
              if (-not (Test-Path $f.FullName)) {
                  Write-Host "::error::$($f.Name) was removed from disk by Defender during the scan"
              }
          }
          exit 0

      - name: Sync the test chain from genesis, on Windows
        run: |
          set -o pipefail
          chmod +x bin/*.exe 2>/dev/null || true
          SYNC_TIMEOUT=9000 bash scripts/test/test_platform_consensus.sh bin 2>&1 | tee gate.log

      # The annotator was put on the build steps and not on this one, so the
      # job whose failure most needs reading said "Process completed with exit
      # code 1" and nothing else -- the exact silence the annotator exists to
      # end, left standing by only half-applying it.
      - name: Say why it failed, where it can be read without a token
        if: failure()
        run: bash scripts/ci_annotate_failure.sh gate.log "the Windows binary agreeing with the chain"

  # -------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false        # one architecture failing must not hide the other
      matrix:
        include:
          # Every Mac sold since 2020 is arm64; everything before it is
          # x86_64, and a binary for one does not run on the other. Both are
          # built because "macOS support" that covers one of them is a support
          # claim that fails for half the people who read it.
          - runner: macos-14
            arch: arm64
          # macos-13 (Intel) is deliberately not here yet.
          #
          # A free public repository gets few macOS runners, and asking for two
          # per run put four runs in a queue that had not started an hour
          # later. Intel Macs are the minority and the smaller half of the
          # audience; arm64 is what most Macs sold since 2020 are. So the first
          # measurement asks one question on one runner, and macos-13 comes
          # back the moment arm64 builds -- "macOS support" that covers one
          # architecture is a support claim that fails for half its readers,
          # and that is a shipping decision, not a diagnosis one.

    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          set -euo pipefail
          brew install automake libtool boost pkg-config libevent cmake sqlite || true
          echo "arch: $(uname -m)"

      - name: Fetch and patch Bitcoin Core
        run: bash scripts/fetch-upstream.sh

      - name: Build for macOS
        run: |
          set -o pipefail
          bash scripts/build_macos.sh 2>&1 | tee build-step.log

      - name: Say why it failed, where it can be read without a token
        if: failure()
        run: bash scripts/ci_annotate_failure.sh build-step.log "building on macOS ${{ matrix.arch }}"

      - name: The instruction-baseline guard
        run: |
          # On arm64 this reports "this check does not apply" and exits 2
          # rather than claiming an Apple Silicon binary is within an x86-64
          # baseline -- a confident answer to a question nobody asked. That
          # is expected here, so 2 is tolerated and anything else is not.
          set +e
          bash scripts/check_isa_baseline.sh out/macos-*/wamd
          st=$?
          set -e
          echo "check_isa_baseline exit: $st"
          if [ "$(uname -m)" = "x86_64" ] && [ "$st" -ne 0 ]; then
            echo "::error::an Intel Mac binary must pass the x86-64 baseline"
            exit 1
          fi
          if [ "$st" -ne 0 ] && [ "$st" -ne 2 ]; then exit "$st"; fi

      - name: Sync the test chain from genesis, on macOS
        run: |
          set -o pipefail
          SYNC_TIMEOUT=9000 bash scripts/test/test_platform_consensus.sh "out/macos-$(uname -m)" 2>&1 | tee gate.log

      - name: Say why it failed, where it can be read without a token
        if: failure()
        run: bash scripts/ci_annotate_failure.sh gate.log "the macOS binary agreeing with the chain"

      - uses: actions/upload-artifact@v7
        with:
          name: wam-macos-${{ matrix.arch }}
          path: out/macos-*/
          retention-days: 14

      - name: Keep the logs whatever happened
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-logs
          path: |
            build/configure-macos.log
            build/make-macos.log
            build/tests-macos.log
          retention-days: 14
          if-no-files-found: ignore
