# WAM Coin — XBridge configuration for Block DX
#
# Block DX runs the coin's own daemon, so this describes how to talk to wamd
# rather than to an intermediary. No Electrum server is involved and no bridge
# or wrapped token exists: WAM settles natively.
#
# Every value here is duplicated from src/wam/chainparams.cpp and
# src/wam/wam-params.h. If the two ever disagree, the source is right.

[WAM]
Title=WAM Coin
Address=
Ip=127.0.0.1
Port=9554
Username=
Password=

# Address prefixes. Mainnet addresses start with 'W'; P2SH with 'w'; WIF keys
# with 'V'.
AddressPrefix=73
ScriptPrefix=135
SecretPrefix=190

# 1 WAM = 100,000,000 base units, as Bitcoin.
COIN=100000000

# Fees, in base units. WAM inherits Bitcoin Core's relay policy unchanged.
MinimumAmount=0
TxVersion=2
DustAmount=546
CreateTxMethod=BTC
GetNewKeySupported=true
ImportWithNoScanSupported=true
MinTxFee=15000
BlockTime=120
FeePerByte=20
Confirmations=6

# ---------------------------------------------------------------------------
# Notes for the integrator
# ---------------------------------------------------------------------------
#
# BlockTime is 120 seconds, not Bitcoin's 600. Confirmations=6 is twelve
# minutes here rather than an hour, which is the comparable safety margin
# rather than the copied number.
#
# Atomic swaps: CLTV, CSV, SegWit and Taproot are all active from height 1, so
# HTLC scripts work without adaptation. There is no activation window to wait
# for and no legacy path to handle.
#
# The RPC port is the peer port MINUS one (9554 against 9555). Bitcoin Core
# reserves peer+1 for its Tor onion listener, so 9556 is taken and must not be
# used.
#
# Daemon: wamd, from https://github.com/wam-coin-official/wam-coin/releases
# It needs libevent and libsqlite3 and nothing else; ZMQ is disabled.
